services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: ${POSTGRES_USER:-wagering_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wagering_app} -d $${POSTGRES_DB:-wagering}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme-local-only}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies every migration once against the compose Postgres and exits.
  # Migrations stay independent of the app's own go.mod/Dockerfile per the
  # stack decision at the top of PLANO.md — this is the official
  # golang-migrate CLI image, never code baked into the app binary.
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-wagering_app}:${POSTGRES_PASSWORD:-changeme-local-only}@postgres:5432/${POSTGRES_DB:-wagering}?sslmode=disable
      - up
    restart: "no"

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_HTTP_ADDR: :8080
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-15s}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: ${POSTGRES_USER:-wagering_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
      POSTGRES_SSLMODE: disable
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # localstack:4566, not 127.0.0.1:4566 — inside the compose network the
      # host-published port mapping does not apply; every service reaches
      # every other one by its service name.
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      # Must be the exact address used to request a token (see the `cli`
      # service below) — Keycloak's iss claim reflects the Host header of
      # whichever request obtained the token, and go-oidc rejects a
      # mismatch. Requesting via the host-published port (127.0.0.1:8081)
      # produces a token this issuer URL would NOT accept.
      OIDC_ISSUER_URL: http://keycloak:8080/realms/wagering
      OIDC_AUDIENCE: wagering-api
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ADDR: :9090
    ports:
      # No fixed host port: with a fixed mapping, `--scale app=N` for N>1
      # would fail immediately on a port conflict for every replica past
      # the first. Docker assigns an ephemeral host port per replica
      # instead — list them with `docker compose port app 8080 --index=N`
      # or `docker compose ps`.
      - "127.0.0.1::8080"
      - "127.0.0.1::9090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-off helper, never started by a plain `up` (profile "tools"):
  # `docker compose run --rm cli curl ...` issues requests from inside the
  # compose network, which is the only way to obtain a client_credentials
  # token whose `iss` the app service above will actually accept (see the
  # OIDC_ISSUER_URL comment). Not part of the running application.
  cli:
    image: curlimages/curl:8.10.1
    profiles: ["tools"]
    entrypoint: ["sh"]

volumes:
  postgres_data:
  localstack_data:
